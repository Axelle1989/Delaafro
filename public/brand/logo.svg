<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Copper to Gold Metallic Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D99A6C" />
      <stop offset="50%" stop-color="#F2D0A4" />
      <stop offset="75%" stop-color="#E8B77E" />
      <stop offset="100%" stop-color="#BD7E50" />
    </linearGradient>

    <!-- Warm Terracotta Gradient -->
    <linearGradient id="terraGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B5532B" />
      <stop offset="100%" stop-color="#8A3A1A" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="luxuryGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2A1409" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Medallion -->
  <rect width="500" height="500" rx="40" fill="url(#terraGradient)" />
  <circle cx="250" cy="250" r="215" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="250" cy="250" r="200" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.8"/>

  <!-- Botanical Leaf Accent (Top Right) -->
  <path d="M 285 105 C 330 95 365 130 355 175 C 320 185 295 155 285 105 Z" fill="#5E7A4A" opacity="0.95" />
  <path d="M 285 105 C 320 140 340 160 355 175" stroke="url(#goldGradient)" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Woman Afro Silhouette & Crown -->
  <g filter="url(#luxuryGlow)">
    <!-- Afro Hair Halo / Cloud -->
    <path d="M 210 135 
             C 160 130, 130 170, 135 220
             C 120 250, 135 290, 165 310
             C 150 330, 180 355, 215 345
             C 240 375, 290 370, 310 340
             C 345 340, 370 305, 360 265
             C 380 220, 350 175, 305 160
             C 285 125, 235 120, 210 135 Z"
          fill="url(#goldGradient)" />
    
    <!-- Profile Silhouette cutout in Terracotta Deep -->
    <path d="M 225 210
             C 245 210, 260 225, 255 245
             C 255 255, 265 260, 260 270
             C 255 280, 245 285, 248 295
             C 252 305, 240 315, 230 318
             C 215 315, 205 295, 210 275
             C 212 250, 205 225, 225 210 Z"
          fill="#8A3A1A" opacity="0.85" />
  </g>

  <!-- Monogram DA Stylized -->
  <text x="250" y="420" 
        font-family="'Playfair Display', serif" 
        font-size="44" 
        font-weight="700" 
        letter-spacing="12" 
        fill="url(#goldGradient)" 
        text-anchor="middle">DELAAFRO</text>

  <text x="250" y="450" 
        font-family="'Plus Jakarta Sans', sans-serif" 
        font-size="12" 
        font-weight="600" 
        letter-spacing="4" 
        fill="#F8EBDD" 
        opacity="0.85"
        text-anchor="middle">BENIN • SOINS NATURELS</text>
</svg>

