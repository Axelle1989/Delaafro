<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <!-- Copper to Gold Metallic Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D99A6C" />
      <stop offset="40%" stop-color="#F2D0A4" />
      <stop offset="70%" stop-color="#E8B77E" />
      <stop offset="100%" stop-color="#BD7E50" />
    </linearGradient>

    <!-- Warm Terracotta Gradient -->
    <linearGradient id="terraGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B5532B" />
      <stop offset="100%" stop-color="#8A3A1A" />
    </linearGradient>

    <!-- Soft Medallion Shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#2A1409" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Creme -->
  <rect width="1200" height="1200" fill="#F8EBDD" />

  <!-- Subtle Elegant Frame -->
  <rect x="40" y="40" width="1120" height="1120" rx="32" fill="none" stroke="#EBD3B8" stroke-width="2" />
  <rect x="56" y="56" width="1088" height="1088" rx="24" fill="none" stroke="#D99A6C" stroke-width="1.5" stroke-dasharray="10 10" opacity="0.4" />

  <!-- Corner Ornamental Motifs -->
  <path d="M 60 100 L 100 60" stroke="#D99A6C" stroke-width="2" opacity="0.5" />
  <path d="M 1140 100 L 1100 60" stroke="#D99A6C" stroke-width="2" opacity="0.5" />
  <path d="M 60 1100 L 100 1140" stroke="#D99A6C" stroke-width="2" opacity="0.5" />
  <path d="M 1140 1100 L 1100 1140" stroke="#D99A6C" stroke-width="2" opacity="0.5" />

  <!-- Central Medallion Outer Rings -->
  <circle cx="600" cy="500" r="270" fill="#FAF1EC" stroke="#EBD3B8" stroke-width="2" />
  <circle cx="600" cy="500" r="250" fill="none" stroke="url(#goldGradient)" stroke-width="3" stroke-dasharray="12 8" opacity="0.75" />
  
  <!-- Central Medallion Base with Shadow -->
  <circle cx="600" cy="500" r="225" fill="url(#terraGradient)" filter="url(#softGlow)" />
  <circle cx="600" cy="500" r="215" fill="none" stroke="url(#goldGradient)" stroke-width="2" opacity="0.8" />

  <!-- Botanical Leaf Accent -->
  <path d="M 635 345 C 685 335 725 375 715 425 C 675 435 645 400 635 345 Z" fill="#5E7A4A" opacity="0.95" />
  <path d="M 635 345 C 675 385 698 408 715 425" stroke="url(#goldGradient)" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Afro Silhouette & Crown (Centered in Medallion) -->
  <g transform="translate(600, 500) scale(1.15) translate(-250, -250)">
    <!-- Afro Hair Halo / Cloud -->
    <path d="M 210 135 
             C 160 130, 130 170, 135 220
             C 120 250, 135 290, 165 310
             C 150 330, 180 355, 215 345
             C 240 375, 290 370, 310 340
             C 345 340, 370 305, 360 265
             C 380 220, 350 175, 305 160
             C 285 125, 235 120, 210 135 Z"
          fill="url(#goldGradient)" />
    
    <!-- Profile Silhouette cutout in Terracotta Deep -->
    <path d="M 225 210
             C 245 210, 260 225, 255 245
             C 255 255, 265 260, 260 270
             C 255 280, 245 285, 248 295
             C 252 305, 240 315, 230 318
             C 215 315, 205 295, 210 275
             C 212 250, 205 225, 225 210 Z"
          fill="#8A3A1A" opacity="0.9" />
  </g>

  <!-- Brand Signature -->
  <text x="600" y="830"
        font-family="'Playfair Display', Georgia, serif"
        font-size="44"
        font-weight="700"
        letter-spacing="14"
        fill="#8A3A1A"
        text-anchor="middle">DELAAFRO</text>

  <line x1="450" y1="865" x2="750" y2="865" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round" />

  <!-- Status Label: Photo bientôt disponible -->
  <text x="600" y="930"
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
        font-size="32"
        font-weight="600"
        letter-spacing="2"
        fill="#2A1409"
        text-anchor="middle">Photo bientôt disponible</text>

  <!-- Subtitle -->
  <text x="600" y="975"
        font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
        font-size="20"
        font-weight="500"
        letter-spacing="4"
        fill="#8A3A1A"
        opacity="0.8"
        text-anchor="middle">SOINS CAPILLAIRES NATURELS • BÉNIN</text>
</svg>
